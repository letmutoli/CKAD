apiVersion: batch/v1
kind: Job
metadata:
  name: jobtest
  labels:
    app: jobexample
    environment: production
    tier: backend
  annotations:
    description: This is a job example
spec:
  completions: 8
  parallelism: 2
  template:
    spec:
      containers:
        - name: jobexample
          image: busybox
          command: ["sh", "-c", "echo Hello World"]
      restartPolicy: Never
