apiVersion: v1
kind: Pod
metadata:
  namespace: test-quota
  name: esempio2
spec:
  containers:
    - image: nginx:latest
      name: nginx
      resources:
        requests:
          cpu: "0.5"
          memory: 256Mi
        limits:
          cpu: "1"
          memory: 1024Mi
    - image: nginx:latest
      name: nginx2
      resources:
        requests:
          cpu: "0.5"
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 1024Mi
