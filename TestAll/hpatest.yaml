apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: my-load-test
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: my-load-deployment
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: python-test
data:
  entrypoint.sh: |-
    #!/usr/bin/env python
    import math
    while True:
      x = 0.0001
      for i in range(100000):
        x = x + math.sqrt(x)
        print(x)
      print("FINITO")
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-load-deployment
spec:
  selector:
    matchLabels:
      app: my-load-deployment
  replicas: 1
  template:
    metadata:
      labels:
        app: my-load-deployment
    spec:
      containers:
        - name: python-container
          image: python
          resources:
            limits:
              cpu: 50m
            requests:
              cpu: 20m
          command:
            - /app/entrypoint.sh
          volumeMounts:
            - name: python-code-volume
              mountPath: /app/entrypoint.sh
              subPath: entrypoint.sh
      volumes:
        - name: python-code-volume
          configMap:
            name: python-test
            defaultMode: 0700
