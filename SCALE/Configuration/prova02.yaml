apiVersion: v1
kind: Pod
metadata:
  name: nginxuse
spec:
  containers:
    - name: nginxuse
      image: nginx:latest
      volumeMounts:
        - name: config-volume
          mountPath: /etc/config
        - name: secret-volume
          mountPath: /etc/secret
  volumes:
    - name: config-volume
      configMap:
        name: db-user
    - name: secret-volume
      secret:
        secretName: dbpass
