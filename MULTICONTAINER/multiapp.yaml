apiVersion: v1
kind: Pod
metadata:
  name: sidecarpattern
spec:
  volumes:
    - name: log-vol
      emptyDir: {}
  containers:
    - name: app1
      image: busybox
      command: ["/bin/sh"]
      args:
        ["-c", "while true;do date >> /var/log/nginx/data.txt;sleep 10;done;"]
      volumeMounts:
        - name: log-vol
          mountPath: /var/log/nginx
    - name: sidecar
      image: nginx:latest
      volumeMounts:
        - name: log-vol
          mountPath: /var/log/nginx
